<style>
:root{--ink:#0f0f0e;--white:#fff;--lime:#c8ff2f;--muted:#55574c;--font:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--pad:clamp(18px,4vw,48px);--line:#e4e4da}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}body{margin:0;background:#fff;color:var(--ink);font:1rem/1.6 var(--font);-webkit-font-smoothing:antialiased}a{color:inherit}:focus-visible{outline:3px solid var(--ink);outline-offset:3px}.wrap{width:min(1120px,100%);margin:auto;padding-inline:var(--pad)}
.skip{position:absolute;left:-999px;top:8px;z-index:10;background:var(--ink);color:var(--lime);padding:10px 16px}.skip:focus{left:8px}.site-header{border-bottom:1px solid var(--line)}.site-header .wrap{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px}.lockup{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:1.2rem;line-height:1}.lockup b{font-weight:500}.lockup i{padding:.18em .32em .22em;border-radius:.28em;background:var(--lime);font-style:normal;font-weight:700}.home-link{font-weight:600;text-decoration:none}.home-link:hover{text-decoration:underline}
main{min-height:calc(100vh - 180px)}.intro{padding:clamp(48px,8vw,88px) 0 34px}.eyebrow{margin:0 0 12px;color:#4f6f00;font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}.intro h1{max-width:12ch;margin:0;font-size:clamp(2.8rem,7vw,5.6rem);line-height:.96;letter-spacing:-.05em}.intro p:last-child{max-width:52ch;margin:18px 0 0;color:#46473f;font-size:1.1rem}
.tools{padding:24px 0;border-block:1px solid var(--line)}.search-form{display:grid;grid-template-columns:minmax(0,1fr) minmax(160px,220px) auto auto;gap:10px;align-items:end}.field{display:grid;gap:6px}.field label{font-size:.84rem;font-weight:600}.field input,.field select{height:48px;width:100%;border:1px solid #c9cabe;border-radius:4px;padding:0 13px;background:#fff;color:var(--ink);font:inherit}.button{min-height:48px;padding:0 18px;border:1px solid var(--ink);border-radius:4px;background:var(--ink);color:#fff;font:600 .95rem var(--font);cursor:pointer}.button:hover{background:#333}.button.secondary{background:#fff;color:var(--ink)}.button.secondary:hover{background:#f1f1e8}.results{padding:26px 0 70px}.results-top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:16px}.results-top h2{margin:0;font-size:1.2rem}.count,.meta{color:var(--muted);font-size:.88rem}.status{margin:26px 0;padding:16px 0;color:var(--muted)}.status.error{color:#8f241d}.post-list{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}.post{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:24px;align-items:center;padding:24px 4px;border-bottom:1px solid var(--line)}.post h3{margin:8px 0 4px;font-size:clamp(1.3rem,2.4vw,1.8rem);line-height:1.18;letter-spacing:-.025em}.post h3 a{text-decoration:none}.post h3 a:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}.post p{max-width:70ch;margin:8px 0;color:#46473f}.topic{display:inline-block;padding:4px 9px;background:#edf3d1;font-size:.76rem;font-weight:700}.post .meta{display:flex;flex-wrap:wrap;gap:12px}.read-link{justify-self:end;text-decoration:none;font-weight:600}.read-link:hover{text-decoration:underline}.load-row{padding-top:24px;text-align:center}.load-row[hidden]{display:none}
.article{max-width:760px;margin:0 auto;padding:clamp(38px,7vw,72px) var(--pad) 80px}.back-link{display:inline-flex;align-items:center;gap:8px;margin-bottom:34px;text-decoration:none;font-weight:600}.back-link:hover{text-decoration:underline}.article h1{margin:16px 0;font-size:clamp(2.3rem,6vw,4.4rem);line-height:1;letter-spacing:-.045em}.article-summary{margin:0 0 28px;color:#45463e;font-size:1.2rem;line-height:1.5}.article-content{margin-top:32px;font-size:1.08rem;line-height:1.8;overflow-wrap:anywhere}.article-content h2,.article-content h3,.article-content h4{margin:1.8em 0 .55em;line-height:1.2;letter-spacing:-.025em}.article-content h2{font-size:1.8rem}.article-content h3{font-size:1.4rem}.article-content p,.article-content ul,.article-content ol,.article-content blockquote,.article-content pre{margin:1.1em 0}.article-content ul,.article-content ol{padding-left:1.5em}.article-content blockquote{margin-left:0;padding:4px 0 4px 20px;border-left:3px solid var(--lime);color:#45463e}.article-content pre{overflow:auto;padding:16px;background:#f1f1e8;border-radius:4px;font-size:.9rem;line-height:1.5}.article-content code{padding:.12em .3em;background:#f1f1e8;border-radius:3px;font-size:.9em}.article-content pre code{padding:0;background:none}.article-content img{display:block;max-width:100%;height:auto;margin:22px auto}.article-content a{color:#315400;text-decoration-thickness:1px;text-underline-offset:3px}.article-content hr{border:0;border-top:1px solid var(--line);margin:2em 0}
footer{padding:28px 0 36px;border-top:1px solid var(--line)}footer .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 28px}footer nav{display:flex;gap:22px;font-size:.92rem}footer nav a{text-decoration:none}footer nav a:hover{text-decoration:underline}footer small{color:var(--muted)}
@media(max-width:680px){.search-form{grid-template-columns:1fr 1fr}.field:first-child{grid-column:1/-1}.search-form .button{width:100%}.post{grid-template-columns:1fr;gap:14px}.read-link{justify-self:start}.results-top{align-items:flex-start;flex-direction:column;gap:4px}}
@media(max-width:420px){.search-form{grid-template-columns:1fr}.field:first-child{grid-column:auto}.search-form .button{width:auto}.site-header .wrap{min-height:68px}}

<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header"><div class="wrap">
  <a class="lockup" href="/" aria-label="NerdMaxxing home"><b>NERD</b><i>MAXXING</i></a>
  <a class="home-link" href="/">Back to NerdMaxxing</a>
</div></header>
<main id="main">
  <section class="intro wrap" id="catalog" aria-labelledby="page-title">
    <p class="eyebrow">NerdMaxxing Journal</p>
    <h1 id="page-title">For the things you get into.</h1>
    <p>Guides, ideas and stories for curious people who like going a little deeper.</p>
  </section>
  <section class="tools" aria-label="Search blogs"><div class="wrap">
    <form class="search-form" id="search-form">
      <div class="field"><label for="search-query">Search articles</label><input id="search-query" name="q" type="search" maxlength="100" placeholder="Try a topic or question" autocomplete="off"></div>
      <div class="field"><label for="search-topic">Topic</label><select id="search-topic" name="topic"><option value="">All topics</option></select></div>
      <button class="button" type="submit">Search</button>
      <button class="button secondary" id="clear-search" type="button">Clear</button>
    </form>
  </div></section>
  <section class="results wrap" aria-labelledby="results-title">
    <div class="results-top"><h2 id="results-title">Latest articles</h2><span class="count" id="result-count" aria-live="polite"></span></div>
    <p class="status" id="status" role="status" aria-live="polite">Loading articles...</p>
    <ul class="post-list" id="post-list"></ul>
    <div class="load-row" id="load-row" hidden><button class="button secondary" id="load-more" type="button">Load more</button></div>
  </section>
  <article class="article" id="article" hidden>
    <a class="back-link" href="/blog">&larr; All articles</a>
    <div id="article-heading"></div>
    <div class="article-content" id="article-content"></div>
  </article>
</main>
<footer><div class="wrap">
  <a class="lockup" href="/" aria-label="NerdMaxxing home"><b>NERD</b><i>MAXXING</i></a>
  <nav aria-label="Footer"><a href="/blog">Blog</a><a href="/privacy">Privacy</a><a href="mailto:hello@nerdmaxxing.com">Contact</a></nav>
  <small>&copy; 2026 NerdMaxxing</small>
</div></footer>
<script>
(function(){
  'use strict';
  var api='https://blog.nerdmaxxing.com';
  var limit=20,offset=0,total=0,searching=false,topics={};
  var form=document.getElementById('search-form'),queryInput=document.getElementById('search-query'),topicSelect=document.getElementById('search-topic');
  var list=document.getElementById('post-list'),status=document.getElementById('status'),count=document.getElementById('result-count');
  var loadRow=document.getElementById('load-row'),results=document.querySelector('.results'),catalog=document.getElementById('catalog'),tools=document.querySelector('.tools');
  var article=document.getElementById('article'),articleHeading=document.getElementById('article-heading'),articleContent=document.getElementById('article-content');

  function setStatus(message,isError){status.textContent=message;status.classList.toggle('error',!!isError);status.hidden=!message}
  function formatDate(value){var date=new Date(value);return Number.isNaN(date.getTime())?'':new Intl.DateTimeFormat(undefined,{year:'numeric',month:'long',day:'numeric'}).format(date)}
  function textElement(tag,text,className){var element=document.createElement(tag);element.textContent=text||'';if(className)element.className=className;return element}
  function addTopic(topic){if(!topic||topics[topic])return;topics[topic]=true;var option=document.createElement('option');option.value=topic;option.textContent=topic;topicSelect.appendChild(option)}
  function makePost(post){
    addTopic(post.topic);
    var item=document.createElement('li');item.className='post';
    var copy=document.createElement('div');
    copy.appendChild(textElement('span',post.topic,'topic'));
    var heading=document.createElement('h3'),link=document.createElement('a');
    link.href='/blog?slug='+encodeURIComponent(post.slug);link.textContent=post.title;heading.appendChild(link);copy.appendChild(heading);
    copy.appendChild(textElement('p',post.summary));
    var meta=document.createElement('div');meta.className='meta';var date=formatDate(post.created_at);if(date)meta.appendChild(textElement('time',date));
    copy.appendChild(meta);item.appendChild(copy);
    var read=document.createElement('a');read.className='read-link';read.href=link.href;read.textContent='Read article';read.setAttribute('aria-label','Read '+post.title);item.appendChild(read);
    return item;
  }
  function renderPosts(data,append){
    var posts=Array.isArray(data.items)?data.items:[];total=Number(data.total)||0;
    if(!append)list.replaceChildren();posts.forEach(function(post){list.appendChild(makePost(post))});
    count.textContent=total?total+' article'+(total===1?'':'s'):'';
    setStatus(posts.length?'':'No articles found. Try another search.');
    loadRow.hidden=offset+posts.length>=total||posts.length===0;
  }
  function requestUrl(){
    var params=new URLSearchParams({limit:String(limit),offset:String(offset)});
    var q=queryInput.value.trim(),topic=topicSelect.value;
    if(searching&&(q||topic)){if(q)params.set('q',q);if(topic)params.set('topic',topic);return api+'/blogs/search?'+params.toString()}
    searching=false;return api+'/blogs?'+params.toString();
  }
  function loadPosts(append){
    if(!append){offset=0;list.replaceChildren();loadRow.hidden=true;setStatus('Loading articles...',false)}
    fetch(requestUrl(),{headers:{Accept:'application/json'}}).then(function(response){if(!response.ok)throw new Error('Articles could not be loaded ('+response.status+').');return response.json()}).then(function(data){renderPosts(data,append)}).catch(function(){setStatus('Articles could not be loaded. Please try again.',true);count.textContent='';loadRow.hidden=true});
  }
  function safeUrl(value){try{var url=new URL(value,api);return url.protocol==='https:'||url.protocol==='http:'?url.href:null}catch(error){return null}}
  function inlineMarkdown(parent,text){
    var pattern=/(!?\[[^\]]*\]\([^)]+\)|\*\*[^*]+\*\*|__[^_]+__|`[^`]+`|\*[^*]+\*|_[^_]+_)/g,match,last=0;
    while((match=pattern.exec(text))){parent.appendChild(document.createTextNode(text.slice(last,match.index)));var token=match[0],node=null;
      var image=token.match(/^!\[([^\]]*)\]\(([^)]+)\)$/),link=token.match(/^\[([^\]]*)\]\(([^)]+)\)$/);
      if(image){var imageUrl=safeUrl(image[2]);if(imageUrl){node=document.createElement('img');node.src=imageUrl;node.alt=image[1];node.loading='lazy'}}
      else if(link){var linkUrl=safeUrl(link[2]);if(linkUrl){node=document.createElement('a');node.href=linkUrl;node.textContent=link[1];node.target='_blank';node.rel='noopener noreferrer'}}
      else if(token.slice(0,2)==='**'||token.slice(0,2)==='__'){node=document.createElement('strong');node.textContent=token.slice(2,-2)}
      else if(token[0]==='*'||token[0]==='_'){node=document.createElement('em');node.textContent=token.slice(1,-1)}
      else if(token[0]==='`'){node=document.createElement('code');node.textContent=token.slice(1,-1)}
      if(node)parent.appendChild(node);else parent.appendChild(document.createTextNode(token));last=pattern.lastIndex;
    }
    parent.appendChild(document.createTextNode(text.slice(last)));
  }
  function renderMarkdown(markdown){
    var lines=String(markdown||'').split(/\r?\n/),index=0,paragraph=[];
    function flush(){if(!paragraph.length)return;var p=document.createElement('p');inlineMarkdown(p,paragraph.join(' '));articleContent.appendChild(p);paragraph=[]}
    while(index<lines.length){var line=lines[index],trimmed=line.trim();
      if(!trimmed){flush();index++;continue}
      if(/^```/.test(trimmed)){flush();var codeLines=[];index++;while(index<lines.length&&!/^```/.test(lines[index].trim()))codeLines.push(lines[index++]);if(index<lines.length)index++;var pre=document.createElement('pre'),code=document.createElement('code');code.textContent=codeLines.join('\n');pre.appendChild(code);articleContent.appendChild(pre);continue}
      var heading=trimmed.match(/^(#{1,6})\s+(.+)$/);if(heading){flush();var h=document.createElement('h'+heading[1].length);inlineMarkdown(h,heading[2]);articleContent.appendChild(h);index++;continue}
      if(/^([-*_]\s*){3,}$/.test(trimmed)){flush();articleContent.appendChild(document.createElement('hr'));index++;continue}
      if(/^>\s?/.test(trimmed)){flush();var quote=[];while(index<lines.length&&/^>\s?/.test(lines[index].trim()))quote.push(lines[index++].trim().replace(/^>\s?/,''));var blockquote=document.createElement('blockquote'),p=document.createElement('p');inlineMarkdown(p,quote.join(' '));blockquote.appendChild(p);articleContent.appendChild(blockquote);continue}
      var listMatch=trimmed.match(/^([-+*]|\d+\.)\s+(.+)$/);if(listMatch){flush();var ordered=/^\d/.test(listMatch[1]),listElement=document.createElement(ordered?'ol':'ul');while(index<lines.length){var itemMatch=lines[index].trim().match(/^([-+*]|\d+\.)\s+(.+)$/);if(!itemMatch||/^\d/.test(itemMatch[1])!==ordered)break;var li=document.createElement('li');inlineMarkdown(li,itemMatch[2]);listElement.appendChild(li);index++}articleContent.appendChild(listElement);continue}
      paragraph.push(trimmed);index++;
    }
    flush();
  }
  function showArticle(slug){
    catalog.hidden=true;tools.hidden=true;results.hidden=true;article.hidden=false;setStatus('Loading article...');
    fetch(api+'/blogs/'+encodeURIComponent(slug),{headers:{Accept:'application/json'}}).then(function(response){if(!response.ok)throw new Error(response.status===404?'This article could not be found.':'This article could not be loaded ('+response.status+').');return response.json()}).then(function(post){
      document.title=post.title+' | NerdMaxxing Blog';articleHeading.replaceChildren();articleContent.replaceChildren();
      articleHeading.appendChild(textElement('span',post.topic,'topic'));articleHeading.appendChild(textElement('h1',post.title));articleHeading.appendChild(textElement('p',post.summary,'article-summary'));
      var date=formatDate(post.created_at);if(date){var meta=textElement('p',date,'meta');articleHeading.appendChild(meta)}
      renderMarkdown(post.content);
    }).catch(function(){articleHeading.replaceChildren();articleContent.replaceChildren(textElement('p','This article could not be loaded. Please try again.','status error'))});
  }
  form.addEventListener('submit',function(event){event.preventDefault();searching=true;document.getElementById('results-title').textContent='Search results';loadPosts(false)});
  document.getElementById('clear-search').addEventListener('click',function(){form.reset();searching=false;document.getElementById('results-title').textContent='Latest articles';loadPosts(false)});
  document.getElementById('load-more').addEventListener('click',function(){offset+=limit;loadPosts(true)});
  var slug=new URLSearchParams(location.search).get('slug');if(slug)showArticle(slug);else loadPosts(false);
})();
</script>
</body>
</html>
